[build]
publish = "_site"
command = "npm run build"

# Production context: all deploys from the Production branch set in your site's
# deploy contexts will inherit these settings.
[context.production]
environment = { NODE_ENV = "production" }

# Deploy Preview context: all deploys generated from a pull/merge request will
# inherit these settings.
[context.deploy-preview]
environment = { NODE_ENV = "production" }
command = "npm run build"

# Branch deploy context: all deploys that are not from a pull/merge request or
# from the Production branch will inherit these settings.
[context.branch-deploy]
environment = { NODE_ENV = "production" }

# Asset optimization
[build.processing]
skip_processing = false
[build.processing.css]
bundle = true
minify = true
[build.processing.js]
bundle = true
minify = true
[build.processing.images]
compress = true

# Headers for security and caching
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self';"

# Cache static assets
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The CMS talks to the GitHub API; everything else stays locked to 'self'
[[headers]]
for = "/admin/*"
[headers.values]
X-Robots-Tag = "noindex"
Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.github.com https://api.netlify.com https://github.com https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://avatars.githubusercontent.com https://*.githubusercontent.com; script-src 'self' https://api.netlify.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-src https://github.com https://api.netlify.com"

# Redirects
[[redirects]]
from = "/currently/"
to = "/now/"
status = 301

[[redirects]]
from = "/currently"
to = "/now"
status = 301

[[redirects]]
from = "/*"
to = "/404.html"
status = 404
